[package]
name = "vasak-prism"
version = "0.10.1"
description = "El lanzador de VasakOS: una consulta, todos los resultados"
authors = ["Vasak Group", "Joaquin (Pato) Decima"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vasak_prism_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Los plugins del escritorio. Los cuatro, no dos: una app de VasakOS tiene que
# hablar el idioma de la sesión y abrir el menú del sistema con el clic derecho.
tauri-plugin-vicons = "2"
tauri-plugin-config-manager = "2"
tauri-plugin-i18n-vsk = "2.1.1"
tauri-plugin-vsk-contextual-menu = "2"
tauri-plugin-shell = "2"

# Para la ventana sin decoración, y para mudar el WebView a la superficie de
# capa: eso es GTK crudo, no hay API de Tauri que lo haga.
gtk = "0.18"
gdk = "0.18"
glib = "0.18"

# La ventana centrada, encima de todo y con el teclado en exclusiva. Con una
# ventana normal el compositor la pone donde quiere y no se queda con el teclado.
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }

# El servicio de D-Bus con el que el atajo del teclado le habla al daemon, y el
# nombre del bus que hace de instancia única.
zbus = { version = "4", default-features = false, features = ["async-io"] }

# La caché del índice de aplicaciones. La misma línea que usan la galería, el
# reproductor y el daemon de notificaciones, así que el paquete ya depende de
# `sqlite` del sistema y no se agrega nada nuevo a la imagen.
rusqlite = { version = "0.32" }

# Para enterarse de que se instaló o se borró una aplicación sin sondear.
inotify = "0.11"

# Para **leer** el índice de archivos que mantiene el gestor de archivos. La
# misma línea que usa él, que es lo que hace que los dos entiendan el mismo
# formato en disco. Acá sólo se lee: tantivy admite muchos lectores y un
# escritor, y el escritor es el gestor.
tantivy = "0.22"
tauri-plugin-vsk-journal = "2"

[features]
# Para poder abrir la ventana compilada sin el servidor de desarrollo detrás.
# Sin esto, `cargo run` en depuración apunta al `devUrl` de `tauri.conf.json` y
# el WebView abre **vacío**: no hay error, no hay nada. La plantilla no lo traía.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# Sólo para el test que valida los catálogos de idioma: el plugin los parsea en
# tiempo de ejecución y **paniquea** si no puede, así que un error de sintaxis no
# se ve hasta que la aplicación no arranca.
serde_yaml = "0.9"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1  # Deja que LLVM optimice mirando todo el programa a la vez.
lto = "thin"       # ~90% del beneficio de fat LTO, compilando mucho más rápido.
opt-level = 3      # Máxima optimización de velocidad.
panic = "abort"    # Sin desenrollado de pila: binario más chico y más rápido.
strip = true       # Fuera los símbolos de depuración.

# Ojo al empaquetar: makepkg inyecta `-flto` global en CFLAGS/LDFLAGS, y los
# crates que compilan C o assembly (ring, vía rustls) emiten bitcode que el
# enlazador de rustc no resuelve. El PKGBUILD tiene que llevar `options=('!lto')`
# — Cargo ya hace su propio LTO acá arriba, así que el de makepkg es redundante
# además de dañino.
